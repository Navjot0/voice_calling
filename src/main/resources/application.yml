server:
  port: 8080

spring:
  application:
    name: extension-calling

# FreeSWITCH ESL connection settings.
# The password must be overridden via the FREESWITCH_PASSWORD environment
# variable in any non-local environment - never hard-code it in source.
#
# NOTE: as of the dynamic extension-provisioning feature, this application is
# expected to run ON THE SAME HOST as FreeSWITCH (see freeswitch.directory.path
# below, a local filesystem path). host therefore defaults back to localhost;
# override with FREESWITCH_HOST only if you genuinely run this app elsewhere
# AND have another way of getting directory XML onto the FreeSWITCH box.
freeswitch:
  host: ${FREESWITCH_HOST:192.168.1.3}
  port: ${FREESWITCH_PORT:8021}
  password: ${FREESWITCH_PASSWORD:ClueCon}
  connection-timeout: 5000
  command-timeout: 10000
  originate:
    # Dial-string prefix used to reach a SIP extension registered with
    # FreeSWITCH's user directory, e.g. "user/1001".
    dial-prefix: "user/"
    caller-id-name: "CPaaS"
  directory:
    # Local filesystem path to FreeSWITCH's directory context - must be
    # writable by the user this Spring Boot process runs as.
    path: ${FREESWITCH_DIRECTORY_PATH:/usr/local/freeswitch/conf/directory/default}
    # Extensions the API will never delete, regardless of who provisioned them.
    protected-extensions: ${FREESWITCH_PROTECTED_EXTENSIONS:1001,1002}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.freeswitch.calling: INFO
    org.freeswitch.esl.client: WARN
